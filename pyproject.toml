[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-science-skills"
version = "0.1.0"
description = "Four evidence-first Claude Code skills for data-science work, with a deterministic engine (dskit)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "scikit-learn>=1.3"]
parquet = ["pyarrow>=14"]

[project.scripts]
dsk = "dskit.cli:main"

[tool.setuptools]
packages = ["dskit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
