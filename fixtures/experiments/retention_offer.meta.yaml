name: Retention offer
hypothesis: Offering one free month to at-risk customers increases renewal (converted).
format: units
primary_metric: converted
metric_type: binary
unit: user
expected_split:
  control: 0.5
  treatment: 0.5
practical_threshold:
  absolute: 0.01
  rationale: +1pp renewal covers the offer cost
secondary_metrics: []
guardrails:
- metric: page_load_ms
  direction: lower_is_better
  max_relative_degradation: 0.05
- metric: refunded
  direction: lower_is_better
  max_absolute_degradation: 0.01
segment_columns:
- device
time_column: assigned_date
alpha: 0.05
planned_duration_days: 14
stopping_rule: fixed horizon, 14 days
assignment: user-level hash randomization
